name: No Merge Guard

on:
  pull_request:
    branches: [ main, master ]

jobs:
  check-no-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for @no_merge markers
        run: |
          # Compare PR changes against base branch
          git fetch origin ${{ github.base_ref }}
          if git diff origin/${{ github.base_ref }}...HEAD | grep -n "@no_merge"; then
            echo "❌ Found @no_merge markers in PR diff. Remove before merging."
            exit 1
          fi

          echo "✅ No forbidden markers found."
